<!doctype html>
<html lang="zh-Hant">
<head>
  <script>if (/github\.io$/.test(location.hostname)) location.replace("https://tokyo-trip-2pc.pages.dev/" + location.hash);</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eef0f3" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>TOKYO · 7 天行程</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-title" content="TOKYO 2026" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <!-- 頂部：桌機是完整分頁列，手機只顯示目前頁名 -->
  <header class="top">
    <div class="top-bar">
      <a class="brand" href="#home" data-go="home"><b>TOKYO</b>·7</a>
      <span class="page-title" id="pageTitle">總覽</span>
      <nav class="nav" id="nav" aria-label="頁面"></nav>
      <div class="pager-arrows">
        <button class="arrow" id="prevPage" aria-label="上一頁">‹</button>
        <button class="arrow" id="nextPage" aria-label="下一頁">›</button>
      </div>
    </div>
  </header>

  <!-- 橫向分頁：每一頁自己上下捲，頁與頁之間左右滑 -->
  <main class="pager" id="pager">
    <!-- 1 總覽：狀態列＋待辦＋注意事項＋行李 -->
    <section class="page" id="home" data-title="總覽">
      <div class="page-in">
        <span class="eyebrow"><span class="dot"></span>Tokyo, Japan · 7 days</span>
        <h1 class="hero-h">七天，<br />走進<em>東京的秋天</em>。</h1>
        <p class="lead" id="lead"></p>
        <div class="start-row">
          <label class="field">出發日 <input type="date" id="startDate" /></label>
          <a class="btn primary" href="#plan" data-go="plan">看每日行程 →</a>
        </div>
        <div class="cloudbar" id="cloudBar"></div>
        <div class="stats" id="stats"></div>
        <div class="swipe-hint" id="swipeHint">← 左右滑動切換頁面 →</div>

        <h2 class="h2">出發前待辦 <span class="cnt" id="todoCnt"></span></h2>
        <p class="sub">打勾會記在這台裝置上（開啟上方雲端同步後也會存到雲端）。要買票、申請的項目都附官方連結。</p>
        <div class="progress"><i id="todoBar"></i></div>
        <div id="todoBody"></div>

        <h2 class="h2">一定要知道的事</h2>
        <div class="grid g3" id="mustBody"></div>

        <h2 class="h2">行李清單 <span class="cnt" id="packCnt"></span></h2>
        <p class="sub" id="packSub"></p>
        <div class="grid g3" id="packBody"></div>
      </div>
    </section>

    <!-- 2 每日行程 -->
    <section class="page" id="plan" data-title="行程">
      <div class="page-in">
        <div id="dayTabsMark" aria-hidden="true"></div><div class="day-tabs" id="dayTabs" role="tablist"></div>
        <div class="day-wrap">
          <div class="day-body" id="dayBody"></div>
          <aside class="day-aside">
            <div class="day-map" id="dayMap"></div>
            <div class="card day-side" id="daySide"></div>
          </aside>
        </div>
      </div>
    </section>

    <!-- 3 地圖 -->
    <section class="page" id="map" data-title="地圖">
      <div class="page-in page-map">
        <div class="map-filters scroll-row" id="mapFilters"></div>
        <div id="bigMap"></div>
      </div>
    </section>

    <!-- 4 美食 -->
    <section class="page" id="food" data-title="美食">
      <div class="page-in">
        <div class="seg" id="foodSeg" role="tablist"></div>
        <div class="scroll-row" id="foodTags" style="margin-top:10px"></div>
        <div id="foodBody"></div>
        <h2 class="h2">吃飯須知</h2>
        <div class="grid g2" id="foodEtiquette"></div>
      </div>
    </section>

    <!-- 5 購物：退稅指南＋購物紀錄核對 -->
    <section class="page" id="shop" data-title="購物">
      <div class="page-in">
        <div class="seg" id="shopSeg" role="tablist"></div>
        <div class="shop-pane" id="shopTax" data-pane="tax"></div>
        <div class="shop-pane" id="shopLedger" data-pane="ledger" hidden></div>
        <div class="shop-pane" id="shopExp" data-pane="exp" hidden></div>
      </div>
    </section>

    <!-- 6 指南：訂票／交通／須知 -->
    <section class="page" id="guide" data-title="指南">
      <div class="page-in">
        <div class="seg" id="guideSeg" role="tablist"></div>
        <div class="guide-pane" id="bookBody" data-pane="book"></div>
        <div class="guide-pane" id="transportBody" data-pane="transport" hidden></div>
        <div class="guide-pane" id="tipsBody" data-pane="tips" hidden></div>
        <footer id="footer"></footer>
      </div>
    </section>
  </main>

  <!-- 手機底部分頁列（iOS 風格玻璃） -->
  <nav class="tabbar" id="tabbar" aria-label="頁面"></nav>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
